# --- MySQL ---
# createDatabaseIfNotExist=true means you do NOT need to manually CREATE DATABASE first.
spring.datasource.url=jdbc:mysql://localhost:3306/care_connect?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=CHANGE_ME
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
# update = auto-creates/alters tables from your entities. Fine for dev;
# switch to validate + a real migration tool (Flyway/Liquibase) before production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- Server ---
server.port=8080

# --- JWT ---
# 256-bit+ secret required by HS256. Replace with your own random string in production
# (e.g. `openssl rand -base64 32`) and keep it out of source control.
app.jwt.secret=CHANGE_ME_this_should_be_a_long_random_secret_key_min_32_chars
app.jwt.expiration-ms=86400000

# --- CORS ---
app.cors.allowed-origin=http://localhost:3000
